[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cautious-chainsaw"
version = "0.1.0"
description = "BF16 and FP16 baseline experiments for INT4 LLM research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Keep the published wheels on the CUDA 12 / Triton 3.6 stack supported by Colab GPUs.
  "torch>=2.5,<2.11",
  "triton>=3.1,<3.7",
  "transformers>=4.46",
  "datasets>=3.1",
  "typer>=0.12",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
chainsaw = "cautious_chainsaw.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cautious_chainsaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU", "integration: may download external resources"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
